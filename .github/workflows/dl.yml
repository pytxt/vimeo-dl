name: download-video
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct file link, m3u8 link, or video page URL"
        required: true

permissions:
  contents: write

jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp
        run: python3 -m pip install -U yt-dlp
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download
        env:
          URL: ${{ inputs.url }}
        run: |
          mkdir out && cd out
          path="${URL%%\?*}"
          ext="${path##*.}"
          ext="${ext,,}"
          case "$ext" in
            mp4|mov|mkv|webm|m4v|mp3|m4a|wav|pdf|jpg|jpeg|png|gif|zip)
              curl -fL --retry 3 -o "file-${GITHUB_RUN_NUMBER}.${ext}" "$URL" ;;
            *)
              yt-dlp --referer "https://vimeo.com/" -f "bv*+ba/b" --merge-output-format mp4 -o "video-%(id)s.%(ext)s" "$URL" ;;
          esac
          ls -la

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" out/* --repo "${{ github.repository }}" --title "file ${{ github.run_number }}" --notes "downloaded"
